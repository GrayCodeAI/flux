name: Feature request
description: Suggest an improvement, a new provider, or a new capability.
title: "feat: <one-line summary>"
labels: ["enhancement", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. eyrie is the LLM client + skill router
        that backs the hawk-eco ecosystem. Every feature is evaluated against
        whether it serves **a single developer** running an AI agent locally.

        Before submitting:
        - Search [existing issues](https://github.com/GrayCodeAI/eyrie/issues) to avoid duplicates.
        - For new providers, please open a discussion first — adding a provider
          is a long-term maintenance commitment.

  - type: dropdown
    id: kind
    attributes:
      label: Kind of feature
      description: What flavour of change is this?
      options:
        - "New provider client (Anthropic-style / OpenAI-compatible / other)"
        - "New capability on an existing provider (streaming, tools, batch, vision, etc.)"
        - "Router / fallback / weighted-selection logic"
        - "Catalog (model metadata, pricing, deprecation)"
        - "Config / profiles / env detection"
        - "Storage / conversation persistence"
        - "Observability (metrics, tracing, logging)"
        - "SDK (Go / Python / TypeScript)"
        - "Tooling / CI / docs"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user problem first. Solutions can come later.
      placeholder: When I'm doing X, eyrie makes me do Y, which costs Z extra tokens / a goroutine leak / ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like eyrie to behave? Snippet of API / config / CLI you'd want.
      render: go
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you try? What do other LLM client libs (langchain-tools, semantic-kernel, autogen, official SDKs) do? Why isn't that enough?

  - type: checkboxes
    id: principles
    attributes:
      label: Developer fit
      description: eyrie avoids enterprise scope. Confirm this feature respects that.
      options:
        - label: Works with zero configuration (sensible defaults).
        - label: Does not require a network call to a hawk-eco service.
        - label: Stores any state locally by default.
        - label: Has an escape hatch (override via flag, env, or config).
