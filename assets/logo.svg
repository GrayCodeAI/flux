<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1f"/>
      <stop offset="100%" style="stop-color:#080812"/>
    </linearGradient>
    <linearGradient id="boltG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ccfff8"/>
      <stop offset="45%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#1a9d94"/>
    </linearGradient>
    <radialGradient id="boltAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ecdc4" stop-opacity="0.5"/>
      <stop offset="100%" style="stop-color:#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow5" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="600" height="200" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="600" height="200" fill="url(#bg)"/>

    <!--
      ICON: Abstract flux mark
      Two interleaved flow arcs around a glowing bolt —
      provider traffic flowing in, one unified interface flowing out.
      Clean, geometric, scalable.
      Icon area: 0..165, centered at 82,100
    -->

    <!-- Aura -->
    <circle cx="82" cy="100" r="52" fill="url(#boltAura)" filter="url(#bloom)"/>

    <!-- Outer flow arc — inbound -->
    <path d="M 38 128 A 46 46 0 0 1 38 72"
          stroke="#1a9d94" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 38 128 L 30 122 M 38 128 L 45 124"
          stroke="#1a9d94" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>

    <!-- Outer flow arc — outbound -->
    <path d="M 126 72 A 46 46 0 0 1 126 128"
          stroke="#4ecdc4" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 126 128 L 134 124 M 126 128 L 119 132"
          stroke="#4ecdc4" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>

    <!-- Inner flow arc — inbound -->
    <path d="M 56 116 A 30 30 0 0 1 56 84"
          stroke="#1a7a74" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Inner flow arc — outbound -->
    <path d="M 108 84 A 30 30 0 0 1 108 116"
          stroke="#4ecdc4" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- Bolt — the unified interface -->
    <path d="M 88 62 L 66 104 L 80 104 L 74 138 L 98 94 L 84 94 Z"
          fill="url(#boltG)" filter="url(#glow5)"/>
    <path d="M 88 62 L 66 104 L 80 104 L 74 138 L 98 94 L 84 94 Z"
          fill="none" stroke="#ccfff8" stroke-width="0.8" opacity="0.4"/>

    <!-- Highlight -->
    <path d="M 86 70 L 72 98" stroke="white" stroke-width="1.4" opacity="0.3" stroke-linecap="round"/>

    <!-- Divider -->
    <line x1="168" y1="24" x2="168" y2="176" stroke="#4ecdc4" stroke-width="0.8" opacity="0.18"/>

    <!-- TEXT -->
    <text x="196" y="96"
          font-family="'SF Mono','Fira Code','Cascadia Code','Courier New',monospace"
          font-size="72" font-weight="800"
          fill="#4ECDC4" filter="url(#textGlow)" letter-spacing="-3">Flux</text>

    <text x="198" y="126"
          font-family="'SF Mono','Fira Code',monospace"
          font-size="14.5" fill="#6a7490" letter-spacing="0.5">Universal LLM provider runtime</text>

    <line x1="198" y1="138" x2="568" y2="138" stroke="#4ecdc4" stroke-width="0.8" opacity="0.5"/>

    <text x="198" y="157"
          font-family="'SF Mono','Fira Code',monospace"
          font-size="12" fill="#4ECDC4" opacity="0.65" letter-spacing="1.5">the foundation layer for hawk</text>
  </g>

  <rect width="600" height="200" fill="none" stroke="#4ecdc4" stroke-width="1" rx="12" opacity="0.6"/>
</svg>
